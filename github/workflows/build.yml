
name: Build Sardar Gaming Space APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o Sardar_Gaming_Space_Android_Project.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Sardar-Gaming-Space-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
